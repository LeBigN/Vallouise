<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12211F">
<title>Vallouise — le carnet de famille</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   VALLOUISE — jetons de design
   ───────────────────────────────────────────────────────────── */
:root{
  --nuit:#12211F; --ardoise:#2C4A47; --granit:#7F8A86;
  --brume:#E4E9E6; --neve:#F4F6F4; --blanc:#FFFFFF;
  --meleze:#E07A1F; --meleze-sombre:#B65D0F; --glacier:#3E7C9B;
  --alerte:#C4472C; --ok:#3F7D5A;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --corps:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cote:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
  --ombre:0 1px 2px rgba(18,33,31,.06),0 8px 24px rgba(18,33,31,.07);
  --nav-h:calc(62px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--neve);color:var(--nuit);font-family:var(--corps);
  font-size:15px;line-height:1.45;padding-bottom:var(--nav-h);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--meleze);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Bandeau d'altitude ─────────────────────────────────────── */
.borne{position:relative;overflow:hidden;background:var(--nuit);color:var(--neve);
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px}
.borne svg.fond{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.borne-in{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.borne h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:-.02em}
.borne .lieu{font-family:var(--cote);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--meleze);margin-bottom:6px;display:block}
.alt{font-family:var(--cote);font-size:11px;text-align:right;color:rgba(244,246,244,.55);white-space:nowrap;line-height:1.5}
.alt b{display:block;font-size:15px;color:var(--neve);font-weight:500}

main{padding:16px 14px 26px;max-width:760px;margin:0 auto}
.vue{display:none;animation:monte .22s ease both}
.vue.on{display:block}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.titre-bloc{font-family:var(--cote);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--granit);margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.titre-bloc::after{content:"";flex:1;height:1px;background:var(--brume)}
.titre-bloc:first-child{margin-top:2px}

.carte{background:var(--blanc);border-radius:var(--r);padding:14px;box-shadow:var(--ombre);margin-bottom:10px}
.carte h3{font-family:var(--display);font-size:17px;margin:0 0 3px;font-weight:700;letter-spacing:-.01em}
.meta{font-family:var(--cote);font-size:11px;color:var(--granit)}
.txt{margin:8px 0 0;white-space:pre-wrap;font-size:14.5px}

.vide{text-align:center;padding:34px 20px;color:var(--granit);
  border:1.5px dashed var(--brume);border-radius:var(--r);background:var(--blanc)}
.vide b{display:block;font-family:var(--display);font-size:16px;color:var(--ardoise);margin-bottom:4px}

/* ── Boutons ────────────────────────────────────────────────── */
.btn{background:var(--nuit);color:var(--neve);border-radius:11px;padding:11px 16px;
  font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;
  transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--meleze)}
.btn.plein{width:100%;justify-content:center}
.btn.fant{background:var(--brume);color:var(--ardoise)}
.btn.danger{background:transparent;color:var(--alerte);padding:6px 0;font-size:13px;font-weight:600}
.btn[disabled]{opacity:.5;pointer-events:none}
.mini{font-family:var(--cote);font-size:11px;color:var(--granit);padding:4px 8px;border-radius:8px;background:var(--brume)}

/* ── Calendrier ─────────────────────────────────────────────── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.cal-nav .mois{font-family:var(--display);font-size:19px;font-weight:700;text-transform:capitalize}
.fleche{width:38px;height:38px;border-radius:11px;background:var(--blanc);box-shadow:var(--ombre);
  display:grid;place-items:center;font-size:17px;color:var(--ardoise);flex:none}
.bloc-cal{background:var(--blanc);border-radius:var(--r);box-shadow:var(--ombre);overflow:hidden}
.consigne{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;background:var(--brume);font-size:13.5px;color:var(--ardoise)}
.consigne.actif{background:var(--nuit);color:var(--neve)}
.consigne b{font-family:var(--display);font-weight:700}
.consigne button{font-family:var(--cote);font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.16);color:inherit;flex:none}
.consigne.actif button{background:rgba(244,246,244,.18)}
.grille{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
.jsem{font-family:var(--cote);font-size:9.5px;color:var(--granit);text-align:center;padding-bottom:5px;text-transform:uppercase}
.jour{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:13.5px;position:relative;transition:transform .1s}
.jour:active{transform:scale(.9)}
.jour.hors{visibility:hidden}
.jour.passe{color:#C3CBC7}
.jour.auj{box-shadow:inset 0 0 0 1.5px var(--nuit);font-weight:700}
.jour.pris{color:var(--blanc);font-weight:600}
.jour.deb{border-radius:9px 3px 3px 9px}
.jour.fin{border-radius:3px 9px 9px 3px}
.jour.mil{border-radius:3px}
.jour.choisi{box-shadow:inset 0 0 0 2.5px var(--meleze);color:var(--meleze-sombre);font-weight:700}
.sel .jour.libre:not(.passe){background:rgba(224,122,31,.09)}
.multi{position:absolute;bottom:4px;display:flex;gap:2px}
.multi i{width:4px;height:4px;border-radius:50%;background:#fff;display:block}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 13px 13px}
.legende span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ardoise)}
.legende i{width:9px;height:9px;border-radius:3px;display:block;flex:none}

/* ── Formulaires ────────────────────────────────────────────── */
label{display:block;font-family:var(--cote);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--granit);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--neve);border:1.5px solid var(--brume);
  border-radius:10px;padding:11px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--ardoise);outline:none}
textarea{min-height:78px;resize:vertical}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recap{background:var(--blanc);border-radius:11px;padding:12px 14px;margin-top:4px;
  border-left:3px solid var(--meleze)}
.recap b{font-family:var(--display);font-size:16px;display:block}

/* ── Feuille modale ─────────────────────────────────────────── */
.voile{position:fixed;inset:0;background:rgba(18,33,31,.55);z-index:60;
  display:none;align-items:flex-end;backdrop-filter:blur(2px)}
.voile.on{display:flex}
.feuille{background:var(--neve);width:100%;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  animation:monte-f .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes monte-f{from{transform:translateY(100%)}to{transform:none}}
.poignee{width:38px;height:4px;border-radius:2px;background:var(--brume);margin:6px auto 12px}
.feuille h2{font-family:var(--display);font-size:20px;margin:0 0 2px;font-weight:700}
@media(min-width:640px){.voile{align-items:center;justify-content:center}
  .feuille{max-width:520px;border-radius:20px;animation:none}}

/* ── Navigation ─────────────────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--brume);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--granit)}
nav button svg.i{width:22px;height:22px}
nav button span.l{font-family:var(--cote);font-size:9px;letter-spacing:.04em}
nav button.on{color:var(--nuit)}
nav button.on span.l{color:var(--meleze)}

/* ── Divers ─────────────────────────────────────────────────── */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 14px);z-index:45;
  width:54px;height:54px;border-radius:18px;background:var(--meleze);color:#fff;
  font-size:26px;display:grid;place-items:center;box-shadow:0 6px 20px rgba(224,122,31,.4)}
.puce{display:inline-flex;align-items:center;gap:5px;font-family:var(--cote);font-size:10.5px;
  padding:3px 8px;border-radius:20px;background:var(--brume);color:var(--ardoise);
  letter-spacing:.05em;text-transform:uppercase}
.puce.o{background:rgba(224,122,31,.13);color:var(--meleze-sombre)}
.pastille{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;font-family:var(--cote);flex:none}
.rangee{display:flex;align-items:center;gap:9px}
.entre{display:flex;align-items:center;justify-content:space-between;gap:10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--brume)}
.lb{position:fixed;inset:0;background:rgba(18,33,31,.96);z-index:70;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:70vh;border-radius:10px}
.lb p{color:var(--neve);text-align:center;margin:14px 0 0;max-width:520px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 18px);
  background:var(--nuit);color:var(--neve);padding:12px 16px;border-radius:11px;z-index:90;
  font-size:14px;box-shadow:var(--ombre);opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:520px;margin:0 auto;text-align:center}
.toast.on{opacity:1}
.toast.mauvais{background:var(--alerte)}
.chargement{text-align:center;padding:60px 20px;color:var(--granit);font-family:var(--cote);font-size:12px}
.etoiles{color:var(--meleze);letter-spacing:1px}
.bandeau{color:var(--neve);text-align:center;font-family:var(--cote);font-size:11px;padding:7px 12px;display:none}
.bandeau.on{display:block}
#off{background:var(--ardoise)}
#panne{background:var(--alerte);font-size:12.5px;line-height:1.5;font-family:var(--corps);text-align:left;padding:12px 16px}
</style>
</head>
<body>

<header class="borne">
  <svg class="fond" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="#E07A1F" stroke-width="1">
      <path d="M-10 96 C 60 88, 90 66, 150 62 S 250 78, 300 58 S 380 34, 410 40"/>
      <path d="M-10 82 C 60 74, 95 52, 152 48 S 248 64, 298 44 S 380 20, 410 26" stroke="#F4F6F4" opacity=".5"/>
      <path d="M-10 108 C 60 102, 88 82, 148 78 S 252 92, 302 74 S 380 50, 410 56" stroke="#F4F6F4" opacity=".3"/>
      <path d="M-10 66 C 65 58, 100 38, 155 34 S 245 50, 296 30 S 380 6, 410 12" opacity=".6"/>
      <path d="M-10 52 C 70 44, 105 26, 158 22 S 242 38, 294 18" opacity=".35"/>
    </g>
  </svg>
  <div class="borne-in">
    <div><span class="lieu">Vallouise · Hautes-Alpes</span><h1 id="titre">Séjours</h1></div>
    <div class="alt"><b id="alt">1 166 m</b><span id="sous">altitude du village</span></div>
  </div>
</header>
<div class="bandeau" id="off">Hors ligne — tes modifications partiront à la reconnexion</div>
<div class="bandeau" id="panne"></div>

<main>
  <div class="chargement" id="boot">Connexion au carnet…</div>

  <!-- ══ SÉJOURS ═════════════════════════════════════════════ -->
  <section class="vue" id="v-sejours">
    <div class="cal-nav">
      <button class="fleche" id="prev" aria-label="Mois précédent">‹</button>
      <button class="mois" id="mois"></button>
      <button class="fleche" id="next" aria-label="Mois suivant">›</button>
    </div>
    <div class="bloc-cal" id="bloc-cal">
      <div class="consigne" id="consigne"></div>
      <div class="grille" id="cal"></div>
      <div class="legende" id="legende"></div>
    </div>
    <button class="btn accent plein" id="poser" style="margin-top:12px">Poser mes dates</button>
    <div class="titre-bloc">À venir</div>
    <div id="liste-sejours"></div>
  </section>

  <section class="vue" id="v-randos"><div id="liste-randos"></div></section>
  <section class="vue" id="v-plans"><div id="liste-plans"></div></section>
  <section class="vue" id="v-photos"><div id="liste-photos"></div></section>

  <section class="vue" id="v-appart">
    <div id="liste-infos"></div>
    <div class="titre-bloc">Toi</div>
    <div class="carte">
      <div class="entre">
        <div class="rangee">
          <div class="pastille" id="ma-pastille"></div>
          <div><b id="mon-nom"></b><div class="meta">membre du carnet</div></div>
        </div>
        <button class="btn fant" id="changer-nom">Modifier</button>
      </div>
    </div>
    <button class="mini" id="cfg-lien" style="margin-top:4px">Configuration Firebase</button>
  </section>
</main>

<button class="fab" id="fab" aria-label="Ajouter">+</button>

<nav>
  <button data-vue="sejours" class="on"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18M7 3v3M17 3v3M4 6h16a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/><path d="M8 13h3v3H8z" fill="currentColor" stroke="none"/></svg><span class="l">SÉJOURS</span></button>
  <button data-vue="randos"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 6 21M13 3l3 6M16 9l5 12M16 9l-4 2M9 13l4 2M11.5 17l4 2"/></svg><span class="l">RANDOS</span></button>
  <button data-vue="plans"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="l">BONS PLANS</span></button>
  <button data-vue="photos"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.8l1.4-2.2h6.6L16.7 7h2.8A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z"/><circle cx="12" cy="12.6" r="3.4"/></svg><span class="l">PHOTOS</span></button>
  <button data-vue="appart"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 19 9 7l3.4 5.6L14.6 9 22 19H2Z"/><path d="M9 7l2.2 3.7-1.6 2.6"/></svg><span class="l">L'APPART</span></button>
</nav>

<div class="voile" id="voile"><div class="feuille" id="feuille"></div></div>
<div class="lb" id="lb"><img id="lb-img" alt=""><p id="lb-txt"></p></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   1. CONFIGURATION FIREBASE  ← à remplir (voir README.md)
   ═══════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyDV-Xqg2oYM9vgRf5eWUl5wsimQayKS-bA",
  authDomain:        "lebign-vallouise.firebaseapp.com",
  projectId:         "lebign-vallouise",
  storageBucket:     "lebign-vallouise.firebasestorage.app",
  messagingSenderId: "435952067567",
  appId:             "1:435952067567:web:8b2df5c23a32b9dfb58c1a"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
         query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ═══════════════════════════════════════════════════════════
   2. OUTILS
   ═══════════════════════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (t,p={},...k)=>{const n=document.createElement(t);
  for(const[a,v]of Object.entries(p)){
    if(v==null) continue;
    if(a==="class")n.className=v; else if(a==="html")n.innerHTML=v;
    else if(a.startsWith("on"))n.addEventListener(a.slice(2),v); else n.setAttribute(a,v);}
  k.flat().forEach(c=>c!=null&&c!==false&&n.append(c.nodeType?c:document.createTextNode(c)));
  return n;};

const COULEURS=["#E07A1F","#3E7C9B","#3F7D5A","#8E5AA8","#C4472C","#B68A0F","#2C6E8E","#A8556B"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JSEM=["L","M","M","J","V","S","D"];
const ALTITUDES={sejours:["1 166 m","altitude du village"],randos:["4 102 m","Barre des Écrins"],
  plans:["1 874 m","Pré de Mme Carle"],photos:["2 542 m","refuge du Glacier Blanc"],appart:["1 166 m","le pied-à-terre"]};

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const auj=()=>iso(new Date());
const jolie=s=>{if(!s)return"";const[a,m,j]=s.split("-");return `${+j} ${MOIS_C[+m-1]} ${a}`;};
const jolieCourt=s=>{if(!s)return"";const[,m,j]=s.split("-");return `${+j} ${MOIS_C[+m-1]}`;};
const nuits=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const nuitees=(a,b)=>{const n=nuits(a,b);return `${n} nuit${n>1?"s":""}`;};
const nb=n=>new Intl.NumberFormat("fr-FR").format(n);
const decale=(s,j)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+j);return iso(d);};

let toastT;
function toast(msg,mauvais){const t=$("#toast");t.textContent=msg;
  t.classList.toggle("mauvais",!!mauvais);t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),mauvais?5000:2600);}

function feuille(titre,corps,apres){
  const f=$("#feuille");f.innerHTML='<div class="poignee"></div>';
  f.append(el("h2",{},titre),corps);f.scrollTop=0;
  $("#voile").classList.add("on");apres?.();
}
const fermer=()=>$("#voile").classList.remove("on");
$("#voile").addEventListener("click",e=>{if(e.target.id==="voile"&&!$("#voile").dataset.bloque)fermer();});

/* ── Écriture NON bloquante ──────────────────────────────────
   Firestore ne résout la promesse qu'après confirmation du serveur.
   On ferme donc l'écran tout de suite (le cache local affiche déjà
   la donnée) et on ne surveille que l'échec.                     */
function ecrire(promesse,msgOk,apres){
  apres?.(); if(msgOk) toast(msgOk);
  promesse.catch(err=>{
    console.error(err);
    const c=err?.code||"";
    toast(c.includes("permission")
      ? "Écriture refusée par Firestore : vérifie les règles de sécurité."
      : "Échec de l'enregistrement — "+(err?.message||c||"raison inconnue"), true);
  });
}
addEventListener("unhandledrejection",e=>{

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
const CLES=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"];

/* La config peut venir de deux endroits :
   1. le bloc firebaseConfig ci-dessus (permanent, valable pour tout le monde)
   2. l'écran de configuration, enregistré dans ce navigateur (dépannage, un appareil) */
function configLocale(){
  try{const j=JSON.parse(localStorage.getItem("vl-config")||"null");return j?.apiKey?j:null;}
  catch{return null;}
}
function extraire(texte){
  const c={};
  for(const k of CLES){
    const m=texte.match(new RegExp(k+'\\s*[:=]\\s*["\'`]([^"\'`]+)["\'`]'));
    if(m) c[k]=m[1].trim();
  }
  return c;
}
function ecranConfig(msg){
  $("#boot")?.remove();
  const bloc=el("div",{class:"vue on",style:"max-width:560px;margin:0 auto"});
  const zone=el("textarea",{id:"cfg",style:"min-height:170px;font-family:var(--cote);font-size:13px",
    placeholder:'const firebaseConfig = {\n  apiKey: "AIza…",\n  authDomain: "…",\n  …\n};'});
  const sortie=el("div",{style:"margin-top:14px"});
  bloc.append(
    el("div",{class:"carte",style:"border-left:3px solid var(--meleze)"},
      el("h3",{},"Configuration Firebase"),
      el("p",{class:"txt"}, msg||"L'app a besoin des identifiants de ton projet Firebase pour synchroniser les données entre les membres de la famille."),
      el("p",{class:"txt",style:"font-size:13.5px;color:var(--granit)"},
        "Console Firebase → ⚙ Paramètres du projet → Vos applications → icône </> → copie tout le bloc firebaseConfig affiché, et colle-le ci-dessous.")),
    el("label",{},"Colle le bloc ici"),
    zone,
    el("button",{class:"btn accent plein",style:"margin-top:14px",onclick:()=>{
      const c=extraire(zone.value);
      const manque=CLES.filter(k=>!c[k]);
      if(manque.length){
        sortie.innerHTML="";
        sortie.append(el("p",{class:"txt",style:"color:var(--alerte)"},
          "Valeurs introuvables dans ce que tu as collé : "+manque.join(", ")+
          ". Copie bien le bloc entier depuis la console Firebase."));
        return;
      }
      localStorage.setItem("vl-config",JSON.stringify(c));
      sortie.innerHTML="";
      const perm='const firebaseConfig = {\n'+CLES.map(k=>`  ${k}: "${c[k]}",`).join("\n").replace(/,$/,"")+'\n};';
      sortie.append(
        el("div",{class:"carte"},
          el("h3",{},"Configuration acceptée"),
          el("p",{class:"txt"},"Elle est enregistrée dans CE navigateur uniquement. Pour que toute la famille en profite, colle le bloc ci-dessous dans index.html (il remplace celui du haut du fichier), puis redéploie."),
          Object.assign(el("textarea",{style:"min-height:150px;font-family:var(--cote);font-size:12.5px",readonly:""}),{value:perm}),
          el("button",{class:"btn fant plein",style:"margin-top:10px",onclick:()=>{
            navigator.clipboard?.writeText(perm).then(()=>toast("Bloc copié"),()=>toast("Copie impossible, sélectionne le texte à la main"));
          }},"Copier le bloc")),
        el("button",{class:"btn accent plein",onclick:()=>location.reload()},"Démarrer l'app"));
      sortie.scrollIntoView({behavior:"smooth"});
    }},"Valider la configuration"),
    sortie
  );
  const ex=configLocale();
  if(ex) bloc.append(el("button",{class:"btn danger plein",style:"margin-top:18px",onclick:()=>{
    localStorage.removeItem("vl-config");location.reload();}},"Effacer la configuration enregistrée"));
  document.querySelector("main").append(bloc);
  $("#fab").style.display="none";
  document.querySelector("nav").style.display="none";
}

function consigne(){
  const z=$("#consigne");z.innerHTML="";z.className="consigne";
  if(!S.selMode){
    z.append(el("span",{},"Touche un jour pour voir qui est là"),
      el("button",{onclick:demarrerSel},"Réserver"));
    return;
  }
  z.classList.add("actif");
  z.append(
    S.selDeb
      ? el("span",{},el("b",{},"Arrivée le "+jolieCourt(S.selDeb)),document.createElement("br"),"Touche maintenant le jour du départ")
      : el("span",{},el("b",{},"Touche ton jour d'arrivée")),
    el("button",{onclick:()=>{S.selMode=false;S.selDeb=null;dessinerCal();}},"Annuler")
  );
}
function demarrerSel(){S.selMode=true;S.selDeb=null;dessinerCal();
  document.querySelector("#bloc-cal").scrollIntoView({behavior:"smooth",block:"center"});}

function dessinerCal(){
  const c=$("#cal");c.innerHTML="";
  const d=S.curseur,an=d.getFullYear(),mo=d.getMonth();
  $("#mois").textContent=`${MOIS[mo]} ${an}`;
  $("#bloc-cal").classList.toggle("sel",S.selMode);
  $("#poser").textContent=S.selMode?"Choisis les jours sur le calendrier":"Poser mes dates";
  $("#poser").disabled=S.selMode;
  consigne();
  JSEM.forEach(j=>c.append(el("div",{class:"jsem"},j)));

  const dec=(new Date(an,mo,1).getDay()+6)%7, fin=new Date(an,mo+1,0).getDate();
  for(let i=0;i<dec;i++) c.append(el("div",{class:"jour hors"}));

  const uids=new Set();
  for(let j=1;j<=fin;j++){
    const date=iso(new Date(an,mo,j));
    const dessus=S.sejours.filter(s=>date>=s.debut&&date<s.fin);
    dessus.forEach(s=>uids.add(s.uid));
    const cl=["jour"];
    if(date===auj()) cl.push("auj");
    if(date<auj()) cl.push("passe");
    if(!dessus.length) cl.push("libre");

    const cell=el("div",{class:cl.join(" "),onclick:()=>toucherJour(date,dessus)},String(j));

    if(dessus.length){
      cell.style.background=membre(dessus[0].uid).couleur;
      cell.classList.add("pris");
      const av=dessus.some(x=>decale(date,-1)>=x.debut&&decale(date,-1)<x.fin);
      const ap=dessus.some(x=>decale(date,1)>=x.debut&&decale(date,1)<x.fin);
      const forme=av&&ap?"mil":av?"fin":ap?"deb":null;
      if(forme) cell.classList.add(forme);
      if(dessus.length>1){
        const m=el("div",{class:"multi"});
        dessus.slice(0,3).forEach(()=>m.append(document.createElement("i")));
        cell.append(m);
      }
    }
    // aperçu de la sélection en cours
    if(S.selMode&&S.selDeb&&date===S.selDeb) cell.classList.add("choisi");
    c.append(cell);
  }

  // légende : qui est là ce mois-ci
  const lg=$("#legende");lg.innerHTML="";
  [...uids].forEach(u=>{const m=membre(u);
    lg.append(el("span",{},el("i",{style:`background:${m.couleur}`}),m.nom));});
  lg.style.display=uids.size?"flex":"none";
}

function toucherJour(date,dessus){
  if(S.selMode){
    if(date<auj()) return toast("Ce jour est déjà passé");
    if(!S.selDeb||date<=S.selDeb){S.selDeb=date;dessinerCal();return;}
    const deb=S.selDeb,f=date;
    S.selMode=false;S.selDeb=null;dessinerCal();
    formSejour(deb,f);
    return;
  }
  if(!dessus.length){
    S.selMode=true;S.selDeb=date;dessinerCal();
    toast("Touche maintenant le jour du départ");
    return;
  }
  const c=el("div");
  c.append(el("p",{class:"meta"},jolie(date)));
  dessus.forEach(s=>{
    const m=membre(s.uid);
    c.append(el("div",{class:"carte"},
      el("div",{class:"rangee"},pastille(s.uid),
        el("div",{},el("h3",{},s.titre||("Séjour de "+m.nom)),
          el("div",{class:"meta"},`${jolie(s.debut)} → ${jolie(s.fin)} · ${nuitees(s.debut,s.fin)}`))),
      s.note?el("p",{class:"txt"},s.note):null,
      s.uid===auth.currentUser.uid
        ? el("button",{class:"btn danger",onclick:()=>{
            if(confirm("Annuler ce séjour ?"))
              ecrire(deleteDoc(doc(db,"sejours",s.id)),"Séjour annulé",fermer);}},"Annuler ce séjour")
        : null));
  });
  c.append(el("button",{class:"btn fant plein",style:"margin-top:10px",
    onclick:()=>{fermer();demarrerSel();}},"Poser mes dates"));
  feuille("Ce jour-là",c);
}

function compresser(file,max=1400,q=.68){
  return new Promise((res,rej)=>{
    const img=new Image(),fr=new FileReader();
    fr.onload=()=>img.src=fr.result;fr.onerror=()=>rej(new Error("lecture impossible"));
    img.onload=()=>{let{width:w,height:h}=img;
      const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
      const cv=Object.assign(document.createElement("canvas"),{width:w,height:h});
      cv.getContext("2d").drawImage(img,0,0,w,h);res(cv.toDataURL("image/jpeg",q));};
    img.onerror=()=>rej(new Error("image illisible"));fr.readAsDataURL(file);
  });
}

  );
  feuille("Ajouter une photo",c,()=>{
    $("#ph-go").onclick=async()=>{
      const f=$("#ph-f").files[0]; if(!f) return toast("Choisis une photo");
      const b=$("#ph-go");b.textContent="Réduction…";b.disabled=true;
      try{
        let data=await compresser(f);
        if(data.length>900000) data=await compresser(f,1100,.55);
        if(data.length>950000){b.textContent="Envoyer la photo";b.disabled=false;
          return toast("Photo trop lourde même réduite",true);}
        ecrire(addDoc(collection(db,"photos"),{data,legende:$("#ph-l").value.trim(),
          uid:auth.currentUser.uid,cree:serverTimestamp()}),"Photo ajoutée",fermer);
      }catch(e){b.textContent="Envoyer la photo";b.disabled=false;
        toast("Impossible de lire ce fichier : "+e.message,true);}
    };
  });
}
function rendrePhotos(){
  const z=$("#liste-photos");z.innerHTML="";
  if(!S.photos.length){z.append(el("div",{class:"vide"},
    el("b",{},"Mur vide"),"La première photo donne le ton — ajoute-la avec le bouton +."));return;}
  z.append(el("div",{class:"titre-bloc"},`${S.photos.length} photo${S.photos.length>1?"s":""}`));
  const g=el("div",{class:"photos"});
  S.photos.forEach(p=>g.append(el("img",{src:p.data,alt:p.legende||"",loading:"lazy",
    onclick:()=>ouvrirPhoto(p)})));
  z.append(g);
}
function ouvrirPhoto(p){
  const lb=$("#lb");$("#lb-img").src=p.data;
  const t=$("#lb-txt");t.innerHTML="";
  t.append((p.legende?p.legende+" — ":"")+membre(p.uid).nom);
  if(p.uid===auth.currentUser.uid)
    t.append(el("div",{},el("button",{class:"btn danger",style:"color:#E07A1F",onclick:()=>{
      if(confirm("Supprimer cette photo ?")){lb.classList.remove("on");
        ecrire(deleteDoc(doc(db,"photos",p.id)),"Photo supprimée");}
    }},"Supprimer cette photo")));
  lb.classList.add("on");
}
$("#lb").onclick=e=>{if(e.target.id==="lb"||e.target.id==="lb-img")$("#lb").classList.remove("on");};

/* ═══════════════════════════════════════════════════════════
   9. L'APPART
   ═══════════════════════════════════════════════════════════ */
function formInfo(i){
  const c=el("div");
  c.append(
    el("label",{},"Titre"),
    el("input",{id:"i-t",placeholder:"Wifi, chauffage, poubelles, clés…",value:i?.titre||""}),
    el("label",{},"Contenu"),
    el("textarea",{id:"i-c",style:"min-height:130px"}),
    el("button",{class:"btn accent plein",style:"margin-top:16px",onclick:()=>{
      const t=$("#i-t").value.trim(); if(!t) return toast("Il manque le titre");
      const d={titre:t,texte:$("#i-c").value.trim(),uid:auth.currentUser.uid};
      ecrire(i?updateDoc(doc(db,"infos",i.id),d)
             :addDoc(collection(db,"infos"),{...d,cree:serverTimestamp()}),
        "Fiche enregistrée",fermer);
    }},i?"Enregistrer":"Ajouter la fiche"),
    i?el("button",{class:"btn danger plein",style:"margin-top:6px",onclick:()=>{
      if(confirm("Supprimer cette fiche ?")) ecrire(deleteDoc(doc(db,"infos",i.id)),"Fiche supprimée",fermer);
    }},"Supprimer la fiche"):null
  );
  feuille(i?"Modifier la fiche":"Nouvelle fiche pratique",c,()=>{$("#i-c").value=i?.texte||"";});
}
function rendreInfos(){
  const z=$("#liste-infos");z.innerHTML="";
  z.append(el("div",{class:"titre-bloc"},"Le mode d'emploi de l'appart"));
  if(!S.infos.length) z.append(el("div",{class:"vide"},el("b",{},"Rien de noté"),
    "Le code du wifi, la vanne d'eau, le jour des poubelles : tout ce qu'on redemande à chaque fois."));
  S.infos.forEach(i=>z.append(el("div",{class:"carte"},
    el("div",{class:"entre"},el("h3",{},i.titre),
      el("button",{class:"mini",onclick:()=>formInfo(i)},"Modifier")),
    el("p",{class:"txt"},i.texte))));
  z.append(el("button",{class:"btn fant plein",style:"margin-top:6px",
    onclick:()=>formInfo()},"+ Ajouter une fiche"));
}

/* ═══════════════════════════════════════════════════════════
   10. NAVIGATION
   ═══════════════════════════════════════════════════════════ */
function aller(v){
  S.vue=v;
  $$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.vue===v));
  $$(".vue").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  const t={sejours:"Séjours",randos:"Randos",plans:"Bons plans",photos:"Photos",appart:"L'appart"};
  $("#titre").textContent=t[v];
  $("#alt").textContent=ALTITUDES[v][0];
  $("#sous").textContent=ALTITUDES[v][1];
  $("#fab").style.display=v==="appart"?"none":"grid";
  window.scrollTo({top:0});
}
$$("nav button").forEach(b=>b.onclick=()=>aller(b.dataset.vue));
$("#prev").onclick=()=>{S.curseur.setMonth(S.curseur.getMonth()-1);dessinerCal();};
$("#next").onclick=()=>{S.curseur.setMonth(S.curseur.getMonth()+1);dessinerCal();};
$("#mois").onclick=()=>{S.curseur=new Date();dessinerCal();toast("Retour au mois en cours");};
$("#poser").onclick=demarrerSel;
$("#fab").onclick=()=>{
  if(S.vue==="sejours") return demarrerSel();
  if(S.vue==="randos")  return formRando();
  if(S.vue==="plans")   return formPlan();
  if(S.vue==="photos")  return formPhoto();
};
$("#changer-nom").onclick=()=>demanderNom(false);
$("#cfg-lien").onclick=()=>{
  if(confirm("Effacer la configuration Firebase enregistrée sur cet appareil ?")){
    localStorage.removeItem("vl-config");location.reload();}
};

// balayage horizontal pour changer de mois
let x0=null;
$("#bloc-cal").addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
$("#bloc-cal").addEventListener("touchend",e=>{
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)<60) return;
  S.curseur.setMonth(S.curseur.getMonth()+(dx<0?1:-1));dessinerCal();
},{passive:true});

addEventListener("online",()=>$("#off").classList.remove("on"));
addEventListener("offline",()=>$("#off").classList.add("on"));
if(!navigator.onLine) $("#off").classList.add("on");

/* ═══════════════════════════════════════════════════════════
   11. SYNCHRONISATION
   ═══════════════════════════════════════════════════════════ */
function ecouter(nom,champ,tri,rendu){
  onSnapshot(query(collection(db,nom),...(tri?[orderBy(...tri)]:[])),
    snap=>{S[champ]=snap.docs.map(d=>({id:d.id,...d.data()}));rendu();},
    err=>{console.error(nom,err);
      toast(`Lecture de « ${nom} » refusée — vérifie les règles Firestore.`,true);});
}
onAuthStateChanged(auth,user=>{
  if(!user){
    signInAnonymously(auth).catch(e=>{
      $("#boot")?.remove();
      const p=$("#panne");p.classList.add("on");
      p.textContent="Connexion refusée ("+(e.code||e.message)+"). Vérifie que la connexion anonyme est activée dans Firebase → Authentication, et que ton domaine figure dans Authentication → Settings → Domaines autorisés.";
    });
    return;
  }
  $("#boot")?.remove();
  aller("sejours");

  onSnapshot(collection(db,"membres"),snap=>{
    S.membres={};snap.forEach(d=>S.membres[d.id]=d.data());
    S.moi=S.membres[user.uid];
    if(S.moi){
      $("#mon-nom").textContent=S.moi.nom;
      const p=$("#ma-pastille");p.style.background=S.moi.couleur;
      p.textContent=S.moi.nom[0].toUpperCase();
      delete $("#voile").dataset.bloque;
    } else demanderNom(true);
    rendreSejours();rendreRandos();rendrePlans();rendrePhotos();
  },err=>{console.error(err);toast("Lecture des membres refusée — vérifie les règles Firestore.",true);});

  ecouter("sejours","sejours",["debut","asc"],rendreSejours);
  ecouter("randos","randos",["nom","asc"],rendreRandos);
  ecouter("plans","plans",["nom","asc"],rendrePlans);
  ecouter("photos","photos",["cree","desc"],rendrePhotos);
  ecouter("infos","infos",["titre","asc"],rendreInfos);
});

if("serviceWorker" in navigator)
  addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
</script>
</body>
</html>
