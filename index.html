<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12211F">
<title>Vallouise — le carnet de famille</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   VALLOUISE — jetons de design
   ───────────────────────────────────────────────────────────── */
:root{
  --nuit:#12211F; --ardoise:#2C4A47; --granit:#7F8A86;
  --brume:#E4E9E6; --neve:#F4F6F4; --blanc:#FFFFFF;
  --meleze:#E07A1F; --meleze-sombre:#B65D0F; --glacier:#3E7C9B;
  --alerte:#C4472C; --ok:#3F7D5A;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --corps:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cote:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
  --ombre:0 1px 2px rgba(18,33,31,.06),0 8px 24px rgba(18,33,31,.07);
  --marge-bas:min(env(safe-area-inset-bottom), 16px);
  --nav-h:calc(62px + var(--marge-bas));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--neve)}
html,body{margin:0;padding:0}
body{background:var(--neve);min-height:100dvh;touch-action:manipulation;-webkit-text-size-adjust:100%;color:var(--nuit);font-family:var(--corps);
  font-size:15px;line-height:1.45;padding-bottom:var(--nav-h);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--meleze);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Bandeau d'altitude ─────────────────────────────────────── */
.borne{position:relative;overflow:hidden;background:var(--nuit);color:var(--neve);
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px}
.borne svg.fond{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.borne-in{position:relative;display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;padding-right:58px}
.borne h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0;letter-spacing:-.02em}
.borne .lieu{font-family:var(--cote);font-size:10px;letter-spacing:.13em;white-space:nowrap;
  text-transform:uppercase;color:var(--meleze);margin-bottom:6px;display:block}
.alt{font-family:var(--cote);font-size:11px;text-align:right;color:rgba(244,246,244,.55);white-space:nowrap;line-height:1.5}
.alt b{display:block;font-size:15px;color:var(--neve);font-weight:500}

main{padding:16px 14px 26px;max-width:760px;margin:0 auto}
.vue{display:none;animation:monte .22s ease both}
.vue.on{display:block}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.titre-bloc{font-family:var(--cote);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--granit);margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.titre-bloc::after{content:"";flex:1;height:1px;background:var(--brume)}
.titre-bloc:first-child{margin-top:2px}

.carte{background:var(--blanc);border-radius:var(--r);padding:14px;box-shadow:var(--ombre);margin-bottom:10px}
.carte h3{font-family:var(--display);font-size:17px;margin:0 0 3px;font-weight:700;letter-spacing:-.01em}
.meta{font-family:var(--cote);font-size:11px;color:var(--granit)}
.txt{margin:8px 0 0;white-space:pre-wrap;font-size:14.5px}

.vide{text-align:center;padding:34px 20px;color:var(--granit);
  border:1.5px dashed var(--brume);border-radius:var(--r);background:var(--blanc)}
.vide b{display:block;font-family:var(--display);font-size:16px;color:var(--ardoise);margin-bottom:4px}

/* ── Boutons ────────────────────────────────────────────────── */
.btn{background:var(--nuit);color:var(--neve);border-radius:11px;padding:11px 16px;
  font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;
  transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--meleze)}
.btn.plein{width:100%;justify-content:center}
.btn.fant{background:var(--brume);color:var(--ardoise)}
.btn.danger{background:transparent;color:var(--alerte);padding:6px 0;font-size:13px;font-weight:600}
.btn[disabled]{opacity:.5;pointer-events:none}
.mini{font-family:var(--cote);font-size:11px;color:var(--granit);padding:4px 8px;border-radius:8px;background:var(--brume)}

/* ── Calendrier ─────────────────────────────────────────────── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.cal-nav .mois{font-family:var(--display);font-size:19px;font-weight:700;text-transform:capitalize}
.fleche{width:38px;height:38px;border-radius:11px;background:var(--blanc);box-shadow:var(--ombre);
  display:grid;place-items:center;font-size:17px;color:var(--ardoise);flex:none}
.bloc-cal{background:var(--blanc);border-radius:var(--r);box-shadow:var(--ombre);overflow:hidden}
.consigne{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;background:var(--brume);font-size:13.5px;color:var(--ardoise)}
.consigne.actif{background:var(--nuit);color:var(--neve)}
.consigne b{font-family:var(--display);font-weight:700}
.consigne button{font-family:var(--cote);font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.16);color:inherit;flex:none}
.consigne.actif button{background:rgba(244,246,244,.18)}
.grille{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px;max-width:392px;
  margin:0 auto;justify-items:stretch}
.jsem{font-family:var(--cote);font-size:9.5px;color:var(--granit);text-align:center;
  padding-bottom:5px;text-transform:uppercase;line-height:1}
.jour{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;width:100%;
  font-size:13.5px;position:relative;transition:transform .1s}
.jour:active{transform:scale(.9)}
.jour.hors{visibility:hidden;pointer-events:none}
.jour.passe{color:#C3CBC7}
.jour.auj{box-shadow:inset 0 0 0 1.5px var(--nuit);font-weight:700}
.jour.pris{color:var(--blanc);font-weight:600}
.jour.deb{border-radius:9px 3px 3px 9px}
.jour.fin{border-radius:3px 9px 9px 3px}
.jour.mil{border-radius:3px}
.jour.choisi{box-shadow:inset 0 0 0 2.5px var(--meleze);color:var(--meleze-sombre);font-weight:700}
.sel .jour.libre:not(.passe){background:rgba(224,122,31,.09)}
.multi{position:absolute;bottom:4px;display:flex;gap:2px}
.multi i{width:4px;height:4px;border-radius:50%;background:#fff;display:block}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 13px 13px}
.legende span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ardoise)}
.legende i{width:9px;height:9px;border-radius:3px;display:block;flex:none}

/* ── Formulaires ────────────────────────────────────────────── */
label{display:block;font-family:var(--cote);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--granit);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--neve);border:1.5px solid var(--brume);
  border-radius:10px;padding:11px 12px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--ardoise);outline:none}
textarea{min-height:78px;resize:vertical}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.recap{background:var(--blanc);border-radius:11px;padding:12px 14px;margin-top:4px;
  border-left:3px solid var(--meleze)}
.recap b{font-family:var(--display);font-size:16px;display:block}

/* ── Feuille modale ─────────────────────────────────────────── */
.voile{position:fixed;inset:0;background:rgba(18,33,31,.55);z-index:60;
  display:none;align-items:flex-end;backdrop-filter:blur(2px)}
.voile.on{display:flex}
.feuille{background:var(--neve);width:100%;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--marge-bas));
  animation:monte-f .26s cubic-bezier(.2,.8,.3,1) both}
@keyframes monte-f{from{transform:translateY(100%)}to{transform:none}}
.poignee{width:44px;height:5px;border-radius:3px;background:#D3DAD6;margin:6px auto 12px;
  cursor:grab;flex:none}
.feuille{will-change:transform}
.feuille h2{font-family:var(--display);font-size:20px;margin:0 0 2px;font-weight:700}
@media(max-height:520px){
  .borne{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:10px}
  .borne h1{font-size:20px}
  .borne .lieu{margin-bottom:3px}
}
@media(min-width:640px){.voile{align-items:center;justify-content:center}
  .feuille{max-width:520px;border-radius:20px;animation:none}}

/* ── Navigation ─────────────────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--brume);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:var(--marge-bas);background:var(--blanc)}
nav button{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--granit)}
nav button svg.i{width:21px;height:21px}
nav button span.l{font-family:var(--cote);font-size:8.5px;letter-spacing:.02em;white-space:nowrap}
nav button.on{color:var(--nuit)}
nav button.on span.l{color:var(--meleze)}

/* ── Divers ─────────────────────────────────────────────────── */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 14px);z-index:45;
  width:54px;height:54px;border-radius:18px;background:var(--meleze);color:#fff;
  font-size:26px;display:grid;place-items:center;box-shadow:0 6px 20px rgba(224,122,31,.4)}
.puce{display:inline-flex;align-items:center;gap:5px;font-family:var(--cote);font-size:10.5px;
  padding:3px 8px;border-radius:20px;background:var(--brume);color:var(--ardoise);
  letter-spacing:.05em;text-transform:uppercase}
.puce.o{background:rgba(224,122,31,.13);color:var(--meleze-sombre)}
.pastille{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;font-family:var(--cote);flex:none}
.rangee{display:flex;align-items:center;gap:9px}
.entre{display:flex;align-items:center;justify-content:space-between;gap:10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;background:var(--brume)}
.vignette{position:relative}
.vignette .sup{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;
  background:rgba(18,33,31,.62);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;
  backdrop-filter:blur(3px)}
.vignette .sup:active{background:var(--alerte)}
.lb{position:fixed;inset:0;background:rgba(18,33,31,.96);z-index:70;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:70vh;border-radius:10px}
.lb p{color:var(--neve);text-align:center;margin:14px 0 0;max-width:520px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 18px);
  background:var(--nuit);color:var(--neve);padding:12px 16px;border-radius:11px;z-index:90;
  font-size:14px;box-shadow:var(--ombre);opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:520px;margin:0 auto;text-align:center}
.toast.on{opacity:1}
.toast.mauvais{background:var(--alerte)}
.chargement{text-align:center;padding:60px 20px;color:var(--granit);font-family:var(--cote);font-size:12px}
.etoiles{color:var(--meleze);letter-spacing:1px}
.onglets{display:flex;gap:4px;background:var(--brume);padding:4px;border-radius:12px;margin-bottom:14px}
.onglets button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--granit)}
.onglets button.on{background:var(--blanc);color:var(--nuit);box-shadow:0 1px 3px rgba(18,33,31,.12)}
.meteo-auj{display:flex;align-items:center;gap:13px}
.meteo-auj .ico{font-size:38px;line-height:1}
.meteo-auj .temp{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1}
.meteo-jours{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:14px;
  border-top:1px solid var(--brume);padding-top:12px}
.meteo-jours .jm{display:flex;flex-direction:column;align-items:center;gap:3px}
.meteo-jours .ico{font-size:19px}
.meteo-jours b{font-size:14px}
svg.trace{width:100%;height:auto;max-height:170px;display:block;margin:12px 0 2px;
  background:var(--neve);border-radius:10px}
.bande-photos{display:flex;gap:6px;overflow-x:auto;margin-top:11px;padding-bottom:2px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.bande-photos img{height:88px;width:auto;border-radius:8px;flex:none;scroll-snap-align:start;
  background:var(--brume)}
#r-phz .vignette{flex:none}
#r-phz img{height:74px}
#panne{background:var(--alerte);color:#fff;font-size:12.5px;line-height:1.5;padding:12px 16px;display:none}
#panne.on{display:block}
.reseau{display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--cote);
  font-size:10.5px;padding:5px 12px;background:var(--brume);color:var(--ardoise)}
.reseau i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.reseau.off{background:var(--ardoise);color:var(--neve)}
.reseau.off i,.reseau.attente i{background:var(--meleze)}
.sos-bulle{position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;z-index:5;
  background:var(--alerte);color:#fff;font-family:var(--cote);font-size:10px;letter-spacing:.1em;
  padding:6px 11px;border-radius:20px;font-weight:700}
.soleil{display:flex;gap:18px;margin-top:12px;border-top:1px solid var(--brume);padding-top:11px;
  font-family:var(--cote);font-size:12px;color:var(--ardoise)}
.vigilance{background:#FBEAE5;border-left:3px solid var(--alerte);border-radius:var(--r);
  padding:13px 14px;margin-bottom:10px}
.vigilance b{font-family:var(--display);font-size:15px;display:block;color:var(--alerte)}
.carrousel{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;margin:0 -14px;
  scroll-snap-type:x mandatory}
.sugg{flex:none;width:238px;scroll-snap-align:start;background:var(--blanc);border-radius:var(--r);
  box-shadow:var(--ombre);overflow:hidden}
.sugg .vis{height:100px;display:grid;place-items:end start;padding:10px;position:relative;overflow:hidden}
.sugg .vis svg{position:absolute;inset:0;width:100%;height:100%}
.sugg .vis span{position:relative;font-family:var(--cote);font-size:9.5px;letter-spacing:.12em;
  color:#fff;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.sugg .cnt{padding:11px 12px 13px}
.sugg h4{font-family:var(--display);font-size:15.5px;margin:0 0 4px;font-weight:700;line-height:1.2}
.carte-embed{width:100%;height:210px;border:0;border-radius:10px;display:block;margin-top:10px;background:var(--brume)}
.sos-gps{font-family:var(--cote);font-size:27px;font-weight:700;line-height:1.45;word-break:break-all}
.sos-ligne{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
</style>
</head>
<body>

<header class="borne">
  <svg class="fond" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke="#E07A1F" stroke-width="1">
      <path d="M-10 96 C 60 88, 90 66, 150 62 S 250 78, 300 58 S 380 34, 410 40"/>
      <path d="M-10 82 C 60 74, 95 52, 152 48 S 248 64, 298 44 S 380 20, 410 26" stroke="#F4F6F4" opacity=".5"/>
      <path d="M-10 108 C 60 102, 88 82, 148 78 S 252 92, 302 74 S 380 50, 410 56" stroke="#F4F6F4" opacity=".3"/>
      <path d="M-10 66 C 65 58, 100 38, 155 34 S 245 50, 296 30 S 380 6, 410 12" opacity=".6"/>
      <path d="M-10 52 C 70 44, 105 26, 158 22 S 242 38, 294 18" opacity=".35"/>
    </g>
  </svg>
  <button class="sos-bulle" id="sos">SOS</button>
  <div class="borne-in">
    <div><span class="lieu">Vallouise · Hautes-Alpes</span><h1 id="titre">Vallouise</h1></div>
    <div class="alt"><b id="alt">1 166 m</b><span id="sous">altitude du village</span></div>
  </div>
</header>
<div class="reseau" id="reseau"><i></i><span id="reseau-txt">En ligne</span></div>
<div id="panne"></div>

<main>
  <div class="chargement" id="boot">Connexion au carnet…</div>

  <!-- ══ ACCUEIL ═════════════════════════════════════════════ -->
  <section class="vue" id="v-accueil"><div id="accueil"></div></section>

  <!-- ══ SÉJOURS ═════════════════════════════════════════════ -->
  <section class="vue" id="v-sejours">
    <div class="cal-nav">
      <button class="fleche" id="prev" aria-label="Mois précédent">‹</button>
      <button class="mois" id="mois"></button>
      <button class="fleche" id="next" aria-label="Mois suivant">›</button>
    </div>
    <div class="bloc-cal" id="bloc-cal">
      <div class="consigne" id="consigne"></div>
      <div class="grille" id="cal"></div>
      <div class="legende" id="legende"></div>
    </div>
    <button class="btn accent plein" id="poser" style="margin-top:12px">Poser mes dates</button>
    <div class="titre-bloc">À venir</div>
    <div id="liste-sejours"></div>
  </section>

  <section class="vue" id="v-sorties">
    <div class="onglets">
      <button class="on" data-sortie="randos">Randos</button>
      <button data-sortie="peche">Pêche</button>
    </div>
    <div id="liste-randos"></div>
    <div id="liste-peche" hidden></div>
  </section>
  <section class="vue" id="v-plans"><div id="liste-plans"></div></section>
  <section class="vue" id="v-photos"><div id="liste-photos"></div></section>

  <section class="vue" id="v-appart">
    <div id="liste-infos"></div>
    <div class="titre-bloc">Toi</div>
    <div class="carte">
      <div class="entre">
        <div class="rangee">
          <div class="pastille" id="ma-pastille"></div>
          <div><b id="mon-nom"></b><div class="meta">membre du carnet</div></div>
        </div>
        <button class="btn fant" id="changer-nom">Modifier</button>
      </div>
    </div>
    <div class="carte">
      <div class="entre">
        <div><b>Contact d'urgence</b><div class="meta" id="urg-txt">aucun</div></div>
        <button class="btn fant" id="urg-btn">Définir</button>
      </div>
    </div>
    <button class="mini" id="cfg-lien" style="margin-top:4px">Configuration Firebase</button>
  </section>
</main>

<button class="fab" id="fab" aria-label="Ajouter">+</button>

<nav>
  <button data-vue="accueil" class="on"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4l8 7.2"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg><span class="l">ACCUEIL</span></button>
  <button data-vue="sejours"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18M7 3v3M17 3v3M4 6h16a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/><path d="M8 13h3v3H8z" fill="currentColor" stroke="none"/></svg><span class="l">SÉJOURS</span></button>
  <button data-vue="sorties"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 6 21M13 3l3 6M16 9l5 12M16 9l-4 2M9 13l4 2M11.5 17l4 2"/></svg><span class="l">SORTIES</span></button>
  <button data-vue="plans"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="l">PLANS</span></button>

function compresser(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image(),fr=new FileReader();
    fr.onload=()=>img.src=fr.result;fr.onerror=()=>rej(new Error("lecture impossible"));
    img.onload=()=>{let{width:w,height:h}=img;
      const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
      const cv=Object.assign(document.createElement("canvas"),{width:w,height:h});
      const cx=cv.getContext("2d");cx.imageSmoothingQuality="high";
      cx.drawImage(img,0,0,w,h);res(cv.toDataURL("image/jpeg",q));};
    img.onerror=()=>rej(new Error("image illisible"));fr.readAsDataURL(file);});
}
/* Qualité d'abord : on ne redescend que si le document dépasse la limite Firestore */
async function preparerPhoto(file){
  for(const [m,q] of [[2000,.85],[1700,.8],[1400,.74],[1100,.62]]){
    const d=await compresser(file,m,q);
    if(d.length<900000) return d;
  }
  return null;
}
function selecteurPhotos(input,zone,liste,apres){
  input.onchange=async e=>{
    const fs=[...e.target.files]; e.target.value="";
    for(let i=0;i<fs.length;i++){
      try{const d=await preparerPhoto(fs[i]);
        if(!d){toast("Une photo est trop lourde même réduite",true);continue;}
        liste.push(d);apres();}
      catch(err){toast("Photo illisible",true);}
    }
    if(liste.length) toast(`${liste.length} photo${liste.length>1?"s":""} prête${liste.length>1?"s":""}`);
  };
}

const NIVEAUX=["Facile","Moyen","Sportif","Alpin"];
function lireGPX(txt){
  const d=new DOMParser().parseFromString(txt,"application/xml");
  if(d.querySelector("parsererror"))throw new Error("fichier GPX illisible");
  const bruts=[...d.querySelectorAll("trkpt,rtept")].map(p=>({
    lat:+p.getAttribute("lat"),lon:+p.getAttribute("lon"),
    ele:+(p.querySelector("ele")?.textContent||0)})).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  if(bruts.length<2)throw new Error("aucun point de trace dans ce fichier");
  let km=0,dplus=0,ref=bruts[0].ele;
  for(let i=1;i<bruts.length;i++){
    const a=bruts[i-1],b=bruts[i],R=6371;
    const dla=(b.lat-a.lat)*Math.PI/180,dlo=(b.lon-a.lon)*Math.PI/180;
    const h=Math.sin(dla/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dlo/2)**2;
    km+=2*R*Math.asin(Math.sqrt(h));
    if(b.ele-ref>4){dplus+=b.ele-ref;ref=b.ele;}else if(b.ele<ref)ref=b.ele;}
  const pas=Math.max(1,Math.ceil(bruts.length/140));
  const pts=bruts.filter((_,i)=>i%pas===0||i===bruts.length-1)
    .map(p=>[+p.lat.toFixed(5),+p.lon.toFixed(5),Math.round(p.ele)]);
  const eles=bruts.map(p=>p.ele).filter(e=>e);
  return {pts,km:+km.toFixed(1),dplus:Math.round(dplus),
    alt:eles.length?{min:Math.round(Math.min(...eles)),max:Math.round(Math.max(...eles))}:null};
}
function projeter(t,W,H,P){
  const lat=t.pts.map(p=>p[0]),lon=t.pts.map(p=>p[1]);
  const k=Math.cos(lat[0]*Math.PI/180);
  const xs=lon.map(v=>v*k),ys=lat.map(v=>-v);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const e=Math.max(x1-x0,y1-y0)||1e-6;
  return xs.map((x,i)=>[P+((x-x0)-((x1-x0)-e)/2)/e*(W-2*P), P+((ys[i]-y0)-((y1-y0)-e)/2)/e*(H-2*P)]);
}
function dessinerTrace(t){
  if(!t?.pts?.length)return null;
  const W=300,H=150,pts=projeter(t,W,H,12);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","trace");
  svg.innerHTML=`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}"
      fill="none" stroke="#E07A1F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="4.5" fill="#3F7D5A"/>
    <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="4.5" fill="#C4472C"/>`;
  return svg;
}
function sourceLien(u){

  if(/strava/.test(h))return "Strava"; if(/alltrails/.test(h))return "AllTrails";
  if(/maps\.apple/.test(h))return "Plans"; if(/google\./.test(h))return "Google Maps";
  if(/openrunner/.test(h))return "Openrunner"; if(/ign|geoportail/.test(h))return "IGN";
  return h||"Lien";
}

let jsPDFpret=null;
function chargerJsPDF(){
  if(jsPDFpret) return jsPDFpret;
  jsPDFpret=new Promise((res,rej)=>{
    if(window.jspdf) return res(window.jspdf.jsPDF);
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>res(window.jspdf.jsPDF);
    s.onerror=()=>rej(new Error("Export PDF indisponible hors ligne"));
    document.head.append(s);});
  return jsPDFpret;
}
function entetePDF(d,titre,sous){
  d.setFillColor(18,33,31); d.rect(0,0,595,74,"F");
  d.setTextColor(224,122,31); d.setFontSize(8);
  d.text("VALLOUISE · HAUTES-ALPES",40,30);
  d.setTextColor(244,246,244); d.setFontSize(19);
  d.text(d.splitTextToSize(titre,480)[0],40,54);
  if(sous){d.setFontSize(9);d.setTextColor(180,190,186);d.text(sous,40,68);}
  d.setTextColor(18,33,31);
}
function piedPDF(d){
  const h=d.internal.pageSize.getHeight();
  d.setFontSize(7);d.setTextColor(127,138,134);
  d.text("Vallouise — le carnet de famille · "+new Date().toLocaleDateString("fr-FR"),40,h-24);
}
async function ajouterPhotoPDF(d,p,titre){
  d.addPage(); entetePDF(d,titre,[val(p.legende),p.date?jolie(p.date):""].filter(Boolean).join(" · "));
  try{const im=new Image();im.src=p.data;await im.decode();
    const r=Math.min(515/im.width,640/im.height);
    d.addImage(p.data,"JPEG",40,110,im.width*r,im.height*r);}catch(e){}
}
async function pdfRando(r){
  try{
    toast("Préparation du PDF…");
    const jsPDF=await chargerJsPDF();
    const d=new jsPDF({unit:"pt",format:"a4"});
    entetePDF(d,r.nom,[val(r.depart),val(r.niveau)].filter(Boolean).join(" · "));
    let y=108; d.setFontSize(10);
    [["Distance",r.trace?.km?r.trace.km+" km":"—"],["Dénivelé +",r.denivele?nb(r.denivele)+" m":"—"],
     ["Durée",r.duree?r.duree+" h":"—"],
     ["Altitudes",r.trace?.alt?`${nb(r.trace.alt.min)} – ${nb(r.trace.alt.max)} m`:"—"]]
    .forEach((m,i)=>{
      const x=40+(i%2)*260, yy=y+Math.floor(i/2)*34;
      d.setTextColor(127,138,134);d.setFontSize(8);d.text(m[0].toUpperCase(),x,yy);
      d.setTextColor(18,33,31);d.setFontSize(13);d.text(String(m[1]),x,yy+16);});
    y+=80;
    if(r.trace?.pts?.length){
      const W=515,H=230,pts=projeter(r.trace,W,H,20);
      d.setDrawColor(228,233,230);d.setFillColor(250,251,250);d.roundedRect(40,y,W,H,8,8,"FD");
      d.setDrawColor(224,122,31);d.setLineWidth(2);
      for(let i=1;i<pts.length;i++) d.line(40+pts[i-1][0],y+pts[i-1][1],40+pts[i][0],y+pts[i][1]);
      d.setFillColor(63,125,90);d.circle(40+pts[0][0],y+pts[0][1],4,"F");
      d.setFillColor(196,71,44);d.circle(40+pts.at(-1)[0],y+pts.at(-1)[1],4,"F");
      y+=H+26;}
    if(r.gps){d.setFontSize(9);d.setTextColor(127,138,134);
      d.text(`Départ GPS : ${r.gps.lat.toFixed(5)}, ${r.gps.lon.toFixed(5)}`,40,y);y+=22;}
    if(r.texte){d.setTextColor(18,33,31);d.setFontSize(11);
      d.splitTextToSize(val(r.texte),515).forEach(l=>{if(y>760){d.addPage();y=60;}d.text(l,40,y);y+=15;});y+=8;}
    liensDe(r).forEach(l=>{if(y>770){d.addPage();y=60;}
      d.setFontSize(9);d.setTextColor(62,124,155);d.text(String(l).slice(0,95),40,y);y+=13;});
    for(const p of S.photos.filter(p=>p.rando===r.id)) await ajouterPhotoPDF(d,p,r.nom);
    for(let i=1;i<=d.internal.getNumberOfPages();i++){d.setPage(i);piedPDF(d);}
    d.save(`rando-${r.nom.replace(/[^\w\-]+/g,"-").toLowerCase()}.pdf`);
  }catch(e){toast(e.message||"Export PDF impossible",true);}
}
async function pdfPeche(){

  {n:"Lac de l'Eychauda",d:"Chambran",dp:780,h:5,km:11,niv:"Moyen",t:["#3F7D5A","#8FC0A4"]},
  {n:"Tête de Gaulent",d:"Puy-Aillaud",dp:1100,h:6,km:12,niv:"Sportif",t:["#B65D0F","#E0A26A"]},
  {n:"Cascade de la Pisse",d:"Entre-les-Aigues",dp:350,h:2,km:5,niv:"Facile",t:["#2C4A47","#7F9E99"]},
  {n:"Lac de Puy Aillaud",d:"Puy-Aillaud",dp:900,h:5,km:10,niv:"Sportif",t:["#8E5AA8","#BFA0D0"]}
];
const METEO={0:["Ciel clair","☀️"],1:["Peu nuageux","🌤"],2:["Nuages épars","⛅"],3:["Couvert","☁️"],
  45:["Brouillard","🌫"],48:["Brouillard givrant","🌫"],51:["Bruine","🌦"],53:["Bruine","🌦"],55:["Bruine","🌦"],
  61:["Pluie faible","🌧"],63:["Pluie","🌧"],65:["Forte pluie","🌧"],66:["Pluie verglaçante","🌧"],67:["Pluie verglaçante","🌧"],
  71:["Neige faible","🌨"],73:["Neige","🌨"],75:["Forte neige","❄️"],77:["Grains de neige","❄️"],
  80:["Averses","🌦"],81:["Averses","🌦"],82:["Fortes averses","⛈"],85:["Averses de neige","🌨"],86:["Averses de neige","🌨"],
  95:["Orage","⛈"],96:["Orage grêleux","⛈"],99:["Orage grêleux","⛈"]};
const jourCourt=s=>["dim","lun","mar","mer","jeu","ven","sam"][new Date(s+"T12:00:00").getDay()];

function alertesDe(m){
  const a=[], c=m.daily.weather_code, pl=m.daily.precipitation_sum||[],
        ng=m.daily.snowfall_sum||[], vt=m.daily.wind_gusts_10m_max||[];
  for(let i=0;i<Math.min(2,c.length);i++){
    const q=i?"demain":"aujourd'hui";
    if(c[i]>=95) a.push(`Orage annoncé ${q} — décale les sorties en altitude.`);
    if(pl[i]>=25) a.push(`Fortes pluies ${q} (${Math.round(pl[i])} mm) — attention aux crues des torrents.`);
    if(ng[i]>=10) a.push(`Chutes de neige ${q} (${Math.round(ng[i])} cm) — vérifie le risque d'avalanche.`);
    if(vt[i]>=70) a.push(`Rafales jusqu'à ${Math.round(vt[i])} km/h ${q}.`);
  }
  return a;
}
async function chargerMeteo(){
  const z=$("#meteo"), za=$("#vigilance");
  if(!z)return;
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude="+VALLOUISE.lat+"&longitude="+VALLOUISE.lon
      +"&current=temperature_2m,weather_code,wind_speed_10m,apparent_temperature"
      +"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_gusts_10m_max,sunrise,sunset"
      +"&timezone=Europe%2FParis&forecast_days=5";
    const r=await fetch(u); if(!r.ok) throw new Error("indisponible");
    const m=await r.json();
    const [lib,ico]=METEO[m.current.weather_code]||["—","•"];
    z.innerHTML="";
    z.append(
      el("div",{class:"meteo-auj"},
        el("div",{class:"ico"},ico),
        el("div",{},el("div",{class:"temp"},Math.round(m.current.temperature_2m)+"°"),
          el("div",{class:"meta"},`${lib} · ressenti ${Math.round(m.current.apparent_temperature)}° · vent ${Math.round(m.current.wind_speed_10m)} km/h`)),
        el("div",{class:"meta",style:"margin-left:auto;text-align:right"},"Vallouise",el("br"),"1 166 m")),
      el("div",{class:"soleil"},
        el("span",{},"🌅 Lever "+heure(m.daily.sunrise[0])),
        el("span",{},"🌇 Coucher "+heure(m.daily.sunset[0]))),
      el("div",{class:"meteo-jours"},
        ...m.daily.time.slice(0,5).map((d,i)=>el("div",{class:"jm"},
          el("span",{class:"meta"},i?jourCourt(d):"auj."),
          el("span",{class:"ico"},(METEO[m.daily.weather_code[i]]||["","•"])[1]),
          el("b",{},Math.round(m.daily.temperature_2m_max[i])+"°"),
          el("span",{class:"meta"},Math.round(m.daily.temperature_2m_min[i])+"°")))));
    if(za){
      za.innerHTML="";
      const al=alertesDe(m);
      if(al.length) za.append(el("div",{class:"vigilance"},
        el("b",{},"⚠️ Alertes & météo"),
        ...al.map(x=>el("div",{class:"txt",style:"font-size:14px"},x)),
        el("p",{class:"meta",style:"margin:8px 0 0"},"Estimation d'après les prévisions — la vigilance officielle fait foi."),
        el("a",{class:"mini",style:"margin-top:8px",target:"_blank",rel:"noopener",
          href:"https://vigilance.meteofrance.fr/fr"},"Vigilance Météo-France ↗")));
    }
  }catch(e){
    z.innerHTML="";
    z.append(el("div",{class:"meta"},"Météo indisponible (pas de réseau ?). Elle s'affichera au retour de la connexion."));
  }
}
function visuelSugg(s){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 240 100");svg.setAttribute("preserveAspectRatio","none");
  const id="g"+Math.random().toString(36).slice(2,7);
  svg.innerHTML=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${s.t[0]}"/><stop offset="1" stop-color="${s.t[1]}"/></linearGradient></defs>
    <rect width="240" height="100" fill="url(#${id})"/>
    <path d="M-10 100 L60 42 L96 74 L130 36 L190 100 Z" fill="rgba(255,255,255,.22)"/>
    <path d="M100 100 L160 50 L200 82 L250 100 Z" fill="rgba(255,255,255,.16)"/>
    <path d="M60 42 L48 58 L60 53 L72 60 Z" fill="rgba(255,255,255,.55)"/>`;
  return svg;
}
function formLien(l){
  const c=el("div");
  c.append(
    el("label",{},"Intitulé"),
    el("input",{id:"l-t",placeholder:"Le Dauphiné — Vallouise",value:val(l?.titre)}),
    el("label",{},"Adresse"),
    el("input",{id:"l-u",type:"url",placeholder:"https://",value:val(l?.url)}),
    el("button",{class:"btn accent plein",style:"margin-top:16px",onclick:()=>{
      const t=$("#l-t").value.trim(),u=$("#l-u").value.trim();
      if(!t||!u)return toast("Intitulé et adresse obligatoires");
      const d={titre:t,url:u,uid:auth.currentUser.uid};
      ecrire(l?updateDoc(doc(db,"liens",l.id),d):addDoc(collection(db,"liens"),{...d,cree:serverTimestamp()}),
        "Lien enregistré",fermer);
    }},l?"Enregistrer":"Ajouter le lien"),
    l?el("button",{class:"btn danger plein",style:"margin-top:6px",onclick:()=>{
      if(confirm("Supprimer ce lien ?"))ecrire(deleteDoc(doc(db,"liens",l.id)),"Lien supprimé",fermer);
    }},"Supprimer"):null);
  feuille(l?"Modifier le lien":"Nouveau lien",c);
}
function rendreAccueil(){
  const z=$("#accueil");if(!z)return;
  z.innerHTML="";
  z.append(el("div",{id:"vigilance"}));

  const futurs=S.sejours.filter(s=>s.fin>=auj()).sort((a,b)=>a.debut<b.debut?-1:1);
  const enCours=futurs.find(s=>s.debut<=auj()), prochain=enCours||futurs[0];
  z.append(el("div",{class:"titre-bloc"},enCours?"En ce moment à l'appart":"Prochain séjour"));
  z.append(prochain?ligneSejour(prochain)
    :el("div",{class:"vide"},el("b",{},"Personne d'annoncé"),"Va dans Séjours pour poser tes dates."));

  z.append(el("div",{class:"titre-bloc"},"Météo du village"));
  z.append(el("div",{class:"carte",id:"meteo"},el("div",{class:"meta"},"Chargement…")));

  z.append(el("div",{class:"titre-bloc"},"Randonnée suggérée"));
  const car=el("div",{class:"carrousel"});
  SUGGESTIONS.forEach(s=>car.append(el("div",{class:"sugg"},
    el("div",{class:"vis"},visuelSugg(s),el("span",{},s.niv)),
    el("div",{class:"cnt"},
      el("h4",{},s.n),
      el("div",{class:"meta"},`${s.d} · ↔ ${s.km} km · ▲ ${nb(s.dp)} m · ⏱ ${s.h} h`),
      el("div",{class:"rangee",style:"margin-top:9px;flex-wrap:wrap"},
        el("a",{class:"mini",target:"_blank",rel:"noopener",
          href:"https://www.google.com/search?q="+encodeURIComponent(s.n+" randonnée Vallouise visorando")},"Itinéraire ↗"),
        el("button",{class:"mini",onclick:()=>{
          ecrire(addDoc(collection(db,"randos"),{nom:s.n,depart:s.d,denivele:String(s.dp),
            duree:String(s.h),niveau:s.niv,texte:"",liens:[],trace:null,gps:null,faite:[],
            uid:auth.currentUser.uid,cree:serverTimestamp()}),"Ajoutée à ton carnet");
        }},"+ Mon carnet"))))));
  z.append(car);
  z.append(el("p",{class:"meta",style:"margin:6px 2px"},
    "Repères indicatifs — vérifie l'itinéraire et les conditions avant de partir."));

  z.append(el("div",{class:"titre-bloc"},"La vallée en direct"));
  z.append(el("div",{class:"carte"},
    el("p",{class:"txt",style:"margin:0 0 10px"},
      "Webcams du domaine : enneigement, fréquentation et ciel en temps réel."),
    el("a",{class:"btn accent plein",target:"_blank",rel:"noopener",
      href:"https://www.paysdesecrins.com/webcams-vallouise-pelvoux/"},"Ouvrir les webcams ↗")));

  z.append(el("div",{class:"titre-bloc"},"Actualités & village"));
  const rang=el("div",{class:"rangee",style:"flex-wrap:wrap;gap:7px"});
  LIENS_VILLAGE.forEach(l=>rang.append(el("a",{class:"mini",href:l.u,target:"_blank",rel:"noopener"},l.t+" ↗")));
  S.liens.forEach(l=>{
    const a=el("a",{class:"mini",href:l.url,target:"_blank",rel:"noopener"},l.titre+" ↗");
    if(l.uid===auth.currentUser.uid)a.addEventListener("contextmenu",e=>{e.preventDefault();formLien(l);});
    rang.append(a);});
  z.append(el("div",{class:"carte"},rang,
    el("button",{class:"btn fant plein",style:"margin-top:12px",onclick:()=>formLien()},"+ Ajouter un lien"),
    S.liens.length?el("p",{class:"meta",style:"margin:8px 0 0"},"Appui long sur un lien que tu as ajouté pour le modifier."):null));

  const gens=Object.entries(S.membres);
  z.append(el("div",{class:"titre-bloc"},`Le carnet · ${gens.length} membre${gens.length>1?"s":""}`));
  const rm=el("div",{class:"rangee",style:"flex-wrap:wrap;gap:10px"});
  gens.forEach(([uid,m])=>rm.append(el("div",{class:"rangee",style:"gap:6px"},
    el("div",{class:"pastille",style:`background:${m.couleur}`},m.nom[0]?.toUpperCase()||"?"),
    el("span",{},m.nom+(uid===auth.currentUser.uid?" (toi)":"")))));
  z.append(el("div",{class:"carte"},rm,
    el("p",{class:"txt",style:"font-size:13.5px;color:var(--granit)"},
      "Chacun apparaît ici dès qu'il a ouvert l'app et choisi son prénom."),
    el("button",{class:"btn plein",onclick:()=>partager("Le carnet de famille de Vallouise : "+location.href)},
      "Partager le lien de l'app")));
}

/* ═══════════════════════════════════════════════════════════
   15. NAVIGATION
   ═══════════════════════════════════════════════════════════ */
function aller(v){
  S.vue=v;
  $$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.vue===v));
  $$(".vue").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  const t={accueil:"Vallouise",sejours:"Séjours",sorties:"Sorties",plans:"Bons plans",
    photos:"Photos",appart:"L'appart"};
  $("#titre").textContent=t[v];
  $("#alt").textContent=ALTITUDES[v][0];
  $("#sous").textContent=ALTITUDES[v][1];
  $("#fab").style.display=(v==="appart"||v==="sejours"||v==="accueil")?"none":"grid";
  if(v==="accueil") chargerMeteo();
  window.scrollTo({top:0});
}
$$("nav button").forEach(b=>b.onclick=()=>aller(b.dataset.vue));
$$(".onglets button[data-sortie]").forEach(b=>b.onclick=()=>{
  S.sortie=b.dataset.sortie;
  $$(".onglets button[data-sortie]").forEach(x=>x.classList.toggle("on",x===b));
  $("#liste-randos").hidden=S.sortie!=="randos";
  $("#liste-peche").hidden=S.sortie!=="peche";
});
$("#prev").onclick=()=>{S.curseur.setMonth(S.curseur.getMonth()-1);dessinerCal();};
$("#next").onclick=()=>{S.curseur.setMonth(S.curseur.getMonth()+1);dessinerCal();};
$("#mois").onclick=()=>{S.curseur=new Date();dessinerCal();toast("Retour au mois en cours");};
$("#poser").onclick=demarrerSel;
$("#fab").onclick=()=>{
  if(S.vue==="sorties") return S.sortie==="peche"?formPrise():formRando();
  if(S.vue==="plans")   return formPlan();
  if(S.vue==="photos")  return formPhoto();
};
$("#changer-nom").onclick=()=>demanderNom(false);
$("#cfg-lien").onclick=()=>{
  if(confirm("Effacer la configuration Firebase enregistrée sur cet appareil ?")){
    localStorage.removeItem("vl-config");location.reload();}};

let x0=null;
$("#bloc-cal").addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
$("#bloc-cal").addEventListener("touchend",e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)<60)return;
  S.curseur.setMonth(S.curseur.getMonth()+(dx<0?1:-1));dessinerCal();},{passive:true});

/* ═══════════════════════════════════════════════════════════
   16. SYNCHRONISATION
   ═══════════════════════════════════════════════════════════ */
function ecouter(nom,champ,tri,rendu){
  onSnapshot(query(collection(db,nom),...(tri?[orderBy(...tri)]:[])),
    snap=>{S[champ]=snap.docs.map(d=>({id:d.id,...d.data()}));rendu();},
    err=>{console.error(nom,err);
      toast(`Lecture de « ${nom} » refusée — les règles Firestore doivent être mises à jour.`,true);});
}
onAuthStateChanged(auth,user=>{
  if(!user){
    signInAnonymously(auth).catch(e=>{
      $("#boot")?.remove();
      const p=$("#panne");p.classList.add("on");
      p.textContent="Connexion refusée ("+(e.code||e.message)+"). Vérifie la connexion anonyme dans Firebase → Authentication, et que ton domaine figure dans Authentication → Settings → Domaines autorisés.";});
    return;}
  $("#boot")?.remove();
  majUrgence(); majReseau(); aller("accueil");

  onSnapshot(collection(db,"membres"),snap=>{
    S.membres={};snap.forEach(d=>S.membres[d.id]=d.data());
    S.moi=S.membres[user.uid];
    if(S.moi){
      $("#mon-nom").textContent=S.moi.nom;
      const p=$("#ma-pastille");p.style.background=S.moi.couleur;p.textContent=S.moi.nom[0].toUpperCase();
      delete $("#voile").dataset.bloque;
    } else demanderNom(true);
    rendreSejours();rendreRandos();rendrePlans();rendrePhotos();rendrePeche();rendreAccueil();
    if(S.vue==="accueil") chargerMeteo();
  },err=>{console.error(err);
    toast("Lecture des membres refusée — les règles Firestore doivent être mises à jour.",true);});

  ecouter("sejours","sejours",["debut","asc"],()=>{rendreSejours();rendreAccueil();chargerMeteo();});
  ecouter("randos","randos",["nom","asc"],rendreRandos);
  ecouter("plans","plans",["nom","asc"],rendrePlans);
  ecouter("photos","photos",["cree","desc"],()=>{rendrePhotos();rendreRandos();rendrePeche();});
  ecouter("infos","infos",["titre","asc"],rendreInfos);
  ecouter("prises","prises",["date","desc"],rendrePeche);
  ecouter("liens","liens",["titre","asc"],()=>{rendreAccueil();chargerMeteo();});
});

if("serviceWorker" in navigator)
  addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));

</script>
